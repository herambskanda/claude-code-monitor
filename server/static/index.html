<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCM Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Crect x='7' y='19' width='18' height='5' rx='2.5' fill='white'/%3E%3Crect x='7' y='10' width='11' height='5' rx='2.5' fill='white' fill-opacity='.7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loadbar"></div>
<header class="top">
  <div class="brand"><i></i><span>CCM</span></div>
  <nav id="tabs" role="tablist" aria-label="Views"></nav>
  <div class="tools">
    <select id="tz" title="Timezone used for days and hours" aria-label="Timezone"></select>
    <button class="btn" id="btn-import" title="Import export files">Import</button>
    <button class="btn icon" id="btn-theme" title="Toggle light / dark" aria-label="Toggle theme">&#9680;</button>
    <button class="btn icon" id="btn-refresh" title="Reload data" aria-label="Reload data">&#8635;</button>
  </div>
</header>
<div class="filters" id="filters"></div>
<main id="view"></main>
<div id="scrim"></div>
<aside id="drawer" aria-hidden="true"></aside>
<div id="modal"><div class="box" id="modal-box"></div></div>
<div id="toast" role="status"></div>
<noscript><p style="padding:20px">The CCM dashboard needs JavaScript.</p></noscript>
<script src="vendor/echarts.min.js"></script>
<script src="util.js"></script>
<script src="app.js"></script>
<script src="views.js"></script>
<script src="views2.js"></script>
</body>
</html>
